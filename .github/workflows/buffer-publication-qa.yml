name: Buffer publication QA
on:
  push:
    branches: [test/classfile-buffer-publication]
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare isolated model tests with Java 25
        run: |
          git fetch --no-tags --depth=1 origin bb43114e42b4b4d8222d86fbcac45ca6b19a0972
          python3 .github/scripts/buffer-publication-qa.py prepare
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          cache: maven
          java-version: |
            8
            17
            21
            25
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
      - name: Build compiler
        run: |
          java -version 2>&1 | tee publication-evidence/java-version.txt
          mvn -version | tee publication-evidence/maven-version.txt
          mvn -B -f org.eclipse.jdt.core.compiler.batch install -DlocalEcjVersion=99.99 -DskipTests
      - name: Baseline, fix, repeated regression and adjacent tests
        shell: bash
        run: |
          set -uo pipefail
          run_tests() {
            local phase="$1"
            local selection="$2"
            python3 .github/scripts/buffer-publication-qa.py clean || return 1
            mvn -B verify -pl org.eclipse.jdt.core.tests.model -am -Ptest-on-javase-25 -Pbree-libs -Dcbi-ecj-version=99.99 "-Dtest=$selection" -DfailIfNoTests=false -Dtycho.showEclipseLog=true '-Dtycho.surefire.argLine=--add-modules ALL-SYSTEM -Dcompliance=1.8,11,17,21 -Djdt.performance.asserts=disabled' 2>&1 | tee "publication-evidence/$phase.log"
            local status=${PIPESTATUS[0]}
            python3 .github/scripts/buffer-publication-qa.py verify "$phase" || return 1
            if [[ "$phase" != baseline && "$status" != 0 ]]; then
              echo "Maven failed despite test reports: phase=$phase exit=$status"
              return 1
            fi
          }
          run_tests baseline ClassFileBufferPublicationTests || exit 1
          python3 .github/scripts/buffer-publication-qa.py apply || exit 1
          run_tests patched ClassFileBufferPublicationTests || exit 1
          run_tests repeat ClassFileBufferPublicationTests || exit 1
          run_tests adjacent ClassFileTests,BufferTests,AttachSourceTests || exit 1
      - name: Export only verified source tree, without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/buffer-publication-qa.py export
      - name: Preserve evidence and source patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-ab-evidence
          include-hidden-files: true
          path: publication-evidence/
