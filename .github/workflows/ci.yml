name: PR 5380 Jenkins log diagnosis
on:
  push:
    branches:
      - qa/pr5380-jenkins-command
permissions:
  contents: read
concurrency:
  group: pr5380-public-jenkins-evidence
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public Jenkins diagnostics
        shell: bash
        run: |
          python - <<'PY'
          """Collect public Jenkins diagnostics. This script performs GET requests only."""
          import concurrent.futures
          import hashlib
          import json
          from pathlib import Path
          import time
          import urllib.request

          ROOT = 'https://ci.eclipse.org/jdt/job/eclipse.jdt.core-Github'
          BUILD_TREE = 'api/json?tree=number,result,duration,timestamp,building,url,builtOn,artifacts[fileName,relativePath]'
          TARGETS = {
              'pr5380-build3.json': f'{ROOT}/job/PR-5380/3/{BUILD_TREE}',
              'pr5380-build3-console.txt': f'{ROOT}/job/PR-5380/3/consoleText',
              'pr5380-build3-stages.json': f'{ROOT}/job/PR-5380/3/wfapi/describe',
              'pr5380-build2-console.txt': f'{ROOT}/job/PR-5380/2/consoleText',
              'master-success.json': f'{ROOT}/job/master/lastSuccessfulBuild/{BUILD_TREE}',
              'master-success-console.txt': f'{ROOT}/job/master/lastSuccessfulBuild/consoleText',
          }
          MAX_BYTES = 32 * 1024 * 1024

          def collect(name, url, output):
              start = time.monotonic()
              entry = {'file': name, 'url': url}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'JDT-PR5380-public-CI-diagnostics'})
                  with urllib.request.urlopen(request, timeout=45) as response:
                      data = response.read(MAX_BYTES + 1)
                      if len(data) > MAX_BYTES:
                          raise ValueError('response exceeds 32 MiB limit')
                      entry.update(status=response.status, final_url=response.url, bytes=len(data),
                                   sha256=hashlib.sha256(data).hexdigest())
                  (output / name).write_bytes(data)
              except Exception as error:
                  entry['error'] = f'{type(error).__name__}: {error}'
              entry['seconds'] = round(time.monotonic() - start, 3)
              return entry

          def main():
              output = Path('jenkins-evidence')
              output.mkdir(exist_ok=True)
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
                  futures = [pool.submit(collect, name, url, output) for name, url in TARGETS.items()]
                  manifest = [future.result() for future in futures]
              text = json.dumps(manifest, indent=2)
              (output / 'manifest.json').write_text(text + '\n')
              print(text)
              required = ('pr5380-build3-console.txt', 'master-success-console.txt')
              if any('error' in item for item in manifest if item['file'] in required):
                  raise SystemExit('Could not retrieve the required public comparison logs; inspect manifest.json')

          if __name__ == '__main__':
              main()
          PY
      - name: Upload diagnostics, including retrieval failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr5380-original-jenkins-evidence
          if-no-files-found: error
          path: jenkins-evidence/
