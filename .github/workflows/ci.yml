name: Formatter region assertions QA
on:
  push:
    branches: [qa/pr5380-region-assertions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: region-assertions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-formatter-controls:
    if: github.repository == 'carstenartur/eclipse.jdt.core'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: |
            21
            25
            26
          mvn-toolchain-id: |
            JavaSE-21
            JavaSE-25
            JavaSE-26
      - name: Bootstrap compiler
        run: |
          set -euo pipefail
          mkdir -p qa-evidence tmp
          java -version
          mvn -B -ntp clean install -f org.eclipse.jdt.core.compiler.batch -DlocalEcjVersion=99.99 -DcompilerBaselineMode=disable -DcompilerBaselineReplace=none -Dcompare-version-with-baselines.skip=true -Dtycho.baseline.replace=none 2>&1 | tee qa-evidence/bootstrap.log
      - name: Verify real formatter, original crash, no-op and final restoration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, shutil, json, os, xml.etree.ElementTree as E
          root=Path('qa-evidence'); module=Path('org.eclipse.jdt.core.tests.model')
          test=module/'src/org/eclipse/jdt/core/tests/formatter/FormatterRegionTests.java'
          production=Path('org.eclipse.jdt.core/formatter/org/eclipse/jdt/internal/formatter/linewrap/WrapPreparator.java')
          candidate=test.read_text(); fixed=production.read_text()
          clamp='Math.max(0, region.getOffset() + region.getLength() - 1)'
          assert fixed.count(clamp)==1
          old=fixed.replace(clamp,'region.getOffset() + region.getLength() - 1')
          call='\t\tDefaultCodeFormatter formatter = new DefaultCodeFormatter(DefaultCodeFormatterConstants.getEclipseDefaultSettings());\n\t\tTextEdit edit = formatter.format(CodeFormatter.K_COMPILATION_UNIT, source, regions, 0, lineSeparator);'
          assert candidate.count(call)==1
          noop=candidate.replace(call,'\t\tTextEdit edit = new org.eclipse.text.edits.MultiTextEdit();')
          for imp in ['org.eclipse.jdt.core.formatter.CodeFormatter','org.eclipse.jdt.core.formatter.DefaultCodeFormatterConstants','org.eclipse.jdt.internal.formatter.DefaultCodeFormatter']:
              noop=noop.replace('import '+imp+';\n','')
          expected_bad={'testEmptyFirstRegionAtDocumentStart','testEmptyFirstRegionAtDocumentStartWithCrLf'}
          all_names=expected_bad|{'testSingleEmptyRegionAtDocumentStartDoesNotChangeSource','testSingleEmptyRegionAfterDocumentStartDoesNotChangeSource'}
          results=[]
          for arm,t,p in [('fixed',candidate,fixed),('without-fix',candidate,old),('noop',noop,fixed),('fixed-repeat',candidate,fixed)]:
              test.write_text(t); production.write_text(p)
              out=root/arm; out.mkdir()
              for path in ['work','surefire-reports']:
                  shutil.rmtree(module/'target'/path,ignore_errors=True)
              cmd=['mvn','-B','-ntp','-pl','org.eclipse.jdt.core.tests.model','-am','verify','-Ptest-on-javase-26','-Dcbi-ecj-version=99.99','-Dtest=FormatterRegionTests','-DfailIfNoTests=false','-Dsurefire.failIfNoSpecifiedTests=false','-Dmaven.test.failure.ignore=false','-Dtycho.baseline.replace=none','-Dcompare-version-with-baselines.skip=true','-Djava.io.tmpdir='+str(Path('tmp').resolve()),'-Dtycho.surefire.argLine=--add-modules ALL-SYSTEM -Dcompliance=17 -Djdt.performance.asserts=disabled']
              (out/'command.json').write_text(json.dumps(cmd,indent=2))
              (out/'FormatterRegionTests.java').write_text(t)
              with (out/'maven.log').open('w') as log:
                  run=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT)
              text=(out/'maven.log').read_text()
              print(arm,run.returncode,flush=True)
              print('\n'.join(x for x in text.splitlines() if any(y in x for y in ['[ERROR]','Tests run:','BUILD SUCCESS','BUILD FAILURE'])),flush=True)
              reports=module/'target/surefire-reports'
              if reports.exists(): shutil.copytree(reports,out/'reports')
              cases=[]
              for report in (out/'reports').glob('TEST-*.xml'):
                  cases.extend(E.parse(report).getroot().iter('testcase'))
              errors={c.get('name'):c.find('error').get('type') for c in cases if c.find('error') is not None}
              failures={c.get('name'):c.find('failure').get('message') for c in cases if c.find('failure') is not None}
              results.append({'arm':arm,'exit':run.returncode,'tests':len(cases),'errors':errors,'failures':failures})
              (root/'results.json').write_text(json.dumps(results,indent=2))
              assert len(cases)==4 and {c.get('name') for c in cases}==all_names,(arm,len(cases))
              assert not any(c.find('skipped') is not None for c in cases)
              if arm.startswith('fixed'):
                  assert run.returncode==0 and not errors and not failures
              elif arm=='without-fix':
                  assert run.returncode!=0 and set(errors)==expected_bad and not failures
                  assert all(v=='java.lang.StringIndexOutOfBoundsException' for v in errors.values()),errors
              else:
                  assert run.returncode!=0 and set(failures)==expected_bad and not errors
          test.write_text(candidate); production.write_text(fixed)
          (root/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','6b777ed704d1a0e00eb87f63ec9042b01b0acd6f','--',str(test)]))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: region-assertions-${{ github.run_id }}
          path: qa-evidence/
