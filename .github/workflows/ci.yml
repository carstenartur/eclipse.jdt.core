name: Buffer publication investigation
on:
  push:
    branches: [investigate/buffer-publication-20260928]
permissions:
  contents: read
concurrency:
  group: buffer-publication-investigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          cache: maven
          java-version: |
            8
            17
            21
            25
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
      - name: Record immutable baseline and constrain test execution
        run: |
          git rev-parse HEAD
          git diff --exit-code a9ba670e61dc6b35c345a34ee97f61d1267bc132 -- org.eclipse.jdt.core/model
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('org.eclipse.jdt.core.tests.model/pom.xml')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          ET.register_namespace('', ns['m'])
          tree = ET.parse(p)
          plugins = tree.find('m:build/m:plugins', ns)
          for plugin in list(plugins):
              if plugin.findtext('m:artifactId', namespaces=ns) == 'maven-surefire-plugin':
                  plugins.remove(plugin)
          tree.write(p, encoding='UTF-8', xml_declaration=True)
          PY
      - name: Build current compiler
        run: mvn --batch-mode -f org.eclipse.jdt.core.compiler.batch clean install -DlocalEcjVersion=99.99
      - name: Execute real PDE model tests with startup diagnostics
        shell: bash
        run: |
          run_probe() {
            label="$1"
            set +e
            mvn --batch-mode -U verify -pl org.eclipse.jdt.core.tests.model -am \
              -Ptest-on-javase-21 -Pbree-libs \
              -Dtest=BufferPublicationInvestigationTests -DfailIfNoTests=false \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -Dtycho.surefire.failIfNoTests=false -Dcbi-ecj-version=99.99 \
              -Dtycho.showEclipseLog=true \
              -Dproject.build.sourceEncoding=UTF-8 \
              -Dtycho.surefire.argLine='--add-modules ALL-SYSTEM -Dcompliance=1.8 -Djdt.performance.asserts=disabled' \
              2>&1 | tee "investigation-${label}-maven.log"
            code=${PIPESTATUS[0]}
            echo "$code" > "investigation-${label}-maven-exit.txt"
            mkdir -p "investigation-${label}-startup-logs"
            find org.eclipse.jdt.core.tests.model/target/work -name '*.log' -type f -exec cp --parents '{}' "investigation-${label}-startup-logs/" ';' || true
            set -e
          }
          run_probe java21
          count=$(python3 -c 'from pathlib import Path; print(len(list(Path("org.eclipse.jdt.core.tests.model/target/surefire-reports").glob("TEST-*.xml"))))')
          if [ "$count" -eq 0 ]; then
            echo 'No JUnit execution on Java 21. Run the identical probe on Java 25 as a startup diagnostic.'
            python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('org.eclipse.jdt.core.tests.model/pom.xml')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          ET.register_namespace('', ns['m'])
          tree = ET.parse(p)
          changed = 0
          for profile in tree.findall('m:profiles/m:profile', ns):
              if profile.findtext('m:id', namespaces=ns) == 'test-on-javase-21':
                  for toolchain_id in profile.findall('.//m:toolchains/m:jdk/m:id', ns):
                      assert toolchain_id.text == 'JavaSE-21'
                      toolchain_id.text = 'JavaSE-25'
                      changed += 1
          assert changed == 1, f'Expected one model-test runtime selection, changed {changed}'
          tree.write(p, encoding='UTF-8', xml_declaration=True)
          PY
            run_probe java25
          fi
          git diff --exit-code a9ba670e61dc6b35c345a34ee97f61d1267bc132 -- org.eclipse.jdt.core/model
      - name: Classify actual JUnit results, not Maven exit status
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          cases = []
          for path in Path('org.eclipse.jdt.core.tests.model/target/surefire-reports').glob('TEST-*.xml'):
              for case in ET.parse(path).iter('testcase'):
                  if case.get('classname', '').endswith('BufferPublicationInvestigationTests'):
                      failures = case.findall('failure')
                      cases.append({'name': case.get('name'), 'failures': [f.get('message', '') for f in failures],
                                    'errors': len(case.findall('error')), 'skipped': len(case.findall('skipped'))})
          report = {'upstream': 'a9ba670e61dc6b35c345a34ee97f61d1267bc132', 'variant': 'unmodified-production', 'cases': cases}
          print(json.dumps(report, indent=2))
          Path('investigation-results.json').write_text(json.dumps(report, indent=2) + '\n')
          assert len(cases) == 5, f'Expected exactly five real test executions, found {len(cases)}'
          assert all(c['errors'] == 0 and c['skipped'] == 0 for c in cases), 'Infrastructure error or skipped test'
          assert len({c['name'] for c in cases}) == 5, 'Duplicate test execution'
          for c in cases:
              if c['name'].startswith('testConcurrent'):
                  assert len(c['failures']) == 1 and 'BUFFER_PUBLICATION:' in c['failures'][0], c
              else:
                  assert not c['failures'], c
          print('CONFIRMED: three intended regression failures; two controls passed. The baseline is NOT fixed.')
          PY
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buffer-publication-baseline-evidence
          include-hidden-files: true
          path: |
            investigation-*.log
            investigation-*.txt
            investigation-*.json
            **/target/surefire-reports/
            **/target/work/data/.metadata/.log
            **/target/work/configuration/*.log
            investigation-*-startup-logs/
