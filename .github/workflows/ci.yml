name: Job wait cleanup regression QA
on:
  push:
    branches: [qa/pr5398-cleanup-assertions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanup-assertions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cleanup-tests:
    if: github.repository == 'carstenartur/eclipse.jdt.core'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare before and after cleanup implementations
        run: python .github/qa/cleanup.py prepare
      - name: Verify three failures before and eleven passes after on Java 21
        run: |
          python .github/qa/cleanup.py before java21-before
          python .github/qa/cleanup.py after java21-after
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '26'
      - name: Repeat corrected cleanup tests on Java 26
        run: |
          for i in 1 2 3; do
            python .github/qa/cleanup.py after java26-after-$i || exit $?
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cleanup-regression-${{ github.run_id }}
          path: qa-cleanup/
