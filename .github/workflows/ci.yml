name: Four compiler methods with verified runtimes
on:
  push:
    branches: [qa/pr5380-four-method-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-four-methods-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiler-probe:
    if: github.repository == 'carstenartur/eclipse.jdt.core'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: |
            21
            25
            26
          mvn-toolchain-id: |
            JavaSE-21
            JavaSE-25
            JavaSE-26
      - name: Resolve exact JDK A and run the original four methods
        run: python .github/qa/compiler-probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: four-method-runtime-${{ github.run_id }}
          path: compiler-evidence/
