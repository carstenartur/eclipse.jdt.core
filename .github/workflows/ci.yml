name: PR 5380 Jenkins reproduction
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORKSPACE: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Set up JDKs including Java 26
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: |
          8
          17
          21
          25
          26
        mvn-toolchain-id: |
          JavaSE-1.8
          JavaSE-17
          JavaSE-21
          JavaSE-25
          JavaSE-26
        distribution: temurin
    - name: Instrument formatter clamp
      run: |
        python - <<'PY'
        from pathlib import Path
        path = Path('org.eclipse.jdt.core/formatter/org/eclipse/jdt/internal/formatter/linewrap/WrapPreparator.java')
        text = path.read_text()
        old = '\t\t\tpreviousRegionEnd = Math.max(0, region.getOffset() + region.getLength() - 1);'
        new = '''\t\t\tint rawRegionEnd = region.getOffset() + region.getLength() - 1;
        \t\t\tif (rawRegionEnd < 0)
        \t\t\t\tSystem.err.println("PR5380_CLAMP_HIT offset=" + region.getOffset() + " length=" + region.getLength());
        \t\t\tpreviousRegionEnd = Math.max(0, rawRegionEnd);'''
        if text.count(old) != 1:
            raise SystemExit(f'expected exactly one clamp expression, found {text.count(old)}')
        path.write_text(text.replace(old, new))
        PY
    - name: Environment
      run: |
        java -version
        mvn -version
        mkdir -p "$WORKSPACE/tmp" "$WORKSPACE/.m2/repository"
    - name: Jenkins bootstrap command
      run: |
        echo "BOOTSTRAP_START=$(date -u +%FT%TZ)"
        /usr/bin/time -v -o "$WORKSPACE/bootstrap-time.txt" \
          mvn clean install -f org.eclipse.jdt.core.compiler.batch \
          -DlocalEcjVersion=99.99 \
          -Dmaven.repo.local="$WORKSPACE/.m2/repository" \
          -DcompilerBaselineMode=disable \
          -DcompilerBaselineReplace=none
        echo "BOOTSTRAP_END=$(date -u +%FT%TZ)"
        cat "$WORKSPACE/bootstrap-time.txt"
    - name: Jenkins verify command
      run: |
        echo "VERIFY_START=$(date -u +%FT%TZ)"
        set +e
        /usr/bin/time -v -o "$WORKSPACE/verify-time.txt" \
          mvn -U clean verify --batch-mode --fail-at-end \
          -Dmaven.repo.local="$WORKSPACE/.m2/repository" \
          -Ptest-on-javase-26 -Pbree-libs -Papi-check -Pjavadoc -Pp2-repo \
          -Dmaven.test.failure.ignore=true \
          -Dcompare-version-with-baselines.skip=false \
          -Djava.io.tmpdir="$WORKSPACE/tmp" -Dproject.build.sourceEncoding=UTF-8 \
          -Dtycho.surefire.argLine="--add-modules ALL-SYSTEM -Dcompliance=1.8,11,17,21,25,26 -Djdt.performance.asserts=disabled" \
          -DDetectVMInstallationsJob.disabled=true \
          -Dtycho.apitools.debug \
          -Dtycho.debug.artifactcomparator \
          -e \
          -Dcbi-ecj-version=99.99
        status=$?
        set -e
        echo "VERIFY_END=$(date -u +%FT%TZ)"
        cat "$WORKSPACE/verify-time.txt" || true
        exit "$status"
    - name: Report clamp hits and timings
      if: always()
      run: |
        echo 'Clamp hits captured in test reports:'
        grep -Rho 'PR5380_CLAMP_HIT[^<]*' . --include='*.xml' --include='*.txt' 2>/dev/null | tee "$WORKSPACE/pr5380-clamp-hits.txt" || true
        echo "PR5380_CLAMP_HIT_COUNT=$(wc -l < "$WORKSPACE/pr5380-clamp-hits.txt")"
        echo 'Bootstrap timing:'
        cat "$WORKSPACE/bootstrap-time.txt" || true
        echo 'Verify timing:'
        cat "$WORKSPACE/verify-time.txt" || true
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pr5380-jenkins-reproduction
        if-no-files-found: warn
        path: |
          ${{ github.workspace }}/bootstrap-time.txt
          ${{ github.workspace }}/verify-time.txt
          ${{ github.workspace }}/pr5380-clamp-hits.txt
          ${{ github.workspace }}/**/target/surefire-reports/*.xml
