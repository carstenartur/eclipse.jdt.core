name: PR 5380 four-method JDK diagnosis
on:
  push:
    branches: [qa/pr5380-focused-jdk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr5380-focused-jdk
  cancel-in-progress: false
jobs:
  four-method-comparison:
    if: github.repository == 'carstenartur/eclipse.jdt.core'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the diagnostic harness
        run: python -m unittest discover -s .github/qa/pr5380-focused -v
      - name: Set up build toolchains and the comparison JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
            26
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
            JavaSE-26
      - name: Acquire and verify the original OpenJDK build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-evidence "$RUNNER_TEMP/pr5380-jdk-a"
          url='https://download.java.net/java/GA/jdk26/c3cc523845074aa0af4f5e1e1ed4151d/34/GPL/openjdk-26_linux-x64_bin.tar.gz'
          checksum='e7c907ec1036e5480609f8212e6f1e7f710310e029d097e4e1a9645c43676945'
          printf 'Publisher metadata: docker-library/openjdk@5b84a21f46f4b8ec5ca7faa67ba6308bda53a4cf\n%s\n%s\n' "$url" "$checksum" > focused-evidence/jdk-a-source.txt
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 "$url" -o "$RUNNER_TEMP/jdk-a.tar.gz"
          echo "$checksum  $RUNNER_TEMP/jdk-a.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/jdk-a.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/pr5380-jdk-a"
          echo "QA_JDK_A=$RUNNER_TEMP/pr5380-jdk-a" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pr5380-jdk-a/bin/java" -XshowSettings:properties -version > focused-evidence/jdk-a-version.txt 2>&1
          "$JAVA_HOME/bin/java" -XshowSettings:properties -version > focused-evidence/jdk-b-version.txt 2>&1
          cat focused-evidence/jdk-a-version.txt focused-evidence/jdk-b-version.txt
          python - <<'PY'
          from pathlib import Path
          import re
          for arm, version in [('a','26+34-2887'), ('b','26.0.2.1+1')]:
              text=Path(f'focused-evidence/jdk-{arm}-version.txt').read_text()
              assert re.search(r'java.runtime.version\s*=\s*'+re.escape(version)+r'\s*$',text,re.M), text
          PY
          { java -version; mvn -version; uname -a; lscpu; df -h; } > focused-evidence/host.txt 2>&1
      - name: Build only required modules and prepare the four-test OSGi runtime
        run: python .github/qa/pr5380-focused/probe.py setup
      - name: Execute four methods in fresh JVMs in A-B-B-A order
        run: python .github/qa/pr5380-focused/probe.py run
      - name: Publish source patches, raw timings, runtime identities and JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr5380-focused-jdk-${{ github.run_id }}
          path: |
            focused-evidence/
            !focused-evidence/runtime-template/**
          if-no-files-found: warn
          retention-days: 30
