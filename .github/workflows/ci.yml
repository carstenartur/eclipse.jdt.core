name: Buffer publication investigation
on:
  push:
    branches: [investigate/buffer-publication-20260928]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/scripts/check-buffer-publication.py'
      - 'org.eclipse.jdt.core.tests.model/**'
      - 'org.eclipse.jdt.core/model/**'
permissions:
  contents: read
concurrency:
  group: buffer-publication-investigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  causal-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          cache: maven
          java-version: |
            8
            17
            21
            25
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
      - name: Record baseline and select the Java 25 test runtime required by this target
        run: |
          mkdir -p investigation-evidence
          git rev-parse HEAD | tee investigation-evidence/tested-commit.txt
          git diff --exit-code a9ba670e61dc6b35c345a34ee97f61d1267bc132 -- org.eclipse.jdt.core/model
          sha256sum org.eclipse.jdt.core.tests.model/src/org/eclipse/jdt/core/tests/model/BufferPublicationInvestigationTests.java > investigation-evidence/test-source.sha256
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('org.eclipse.jdt.core.tests.model/pom.xml')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          ET.register_namespace('', ns['m'])
          tree = ET.parse(p)
          plugins = tree.find('m:build/m:plugins', ns)
          for plugin in list(plugins):
              if plugin.findtext('m:artifactId', namespaces=ns) == 'maven-surefire-plugin':
                  plugins.remove(plugin)
          changed = 0
          for profile in tree.findall('m:profiles/m:profile', ns):
              if profile.findtext('m:id', namespaces=ns) == 'test-on-javase-21':
                  for toolchain_id in profile.findall('.//m:toolchains/m:jdk/m:id', ns):
                      assert toolchain_id.text == 'JavaSE-21'
                      toolchain_id.text = 'JavaSE-25'
                      changed += 1
          assert changed == 1, changed
          tree.write(p, encoding='UTF-8', xml_declaration=True)
          p = Path('org.eclipse.jdt.core/pom.xml')
          text = p.read_text()
          assert text.count('<baselineMode>warn</baselineMode>') == 1
          assert text.count('<baselineReplace>common</baselineReplace>') == 1
          text = text.replace('<baselineMode>warn</baselineMode>', '<baselineMode>disable</baselineMode>')
          text = text.replace('<baselineReplace>common</baselineReplace>', '<baselineReplace>none</baselineReplace>')
          p.write_text(text)
          PY
          git diff -- org.eclipse.jdt.core.tests.model/pom.xml org.eclipse.jdt.core/pom.xml > investigation-evidence/test-runtime-configuration.diff
      - name: Build current compiler
        run: mvn --batch-mode -f org.eclipse.jdt.core.compiler.batch clean install -DlocalEcjVersion=99.99 -Dtycho.baseline.replace=none
      - name: Run baseline and initialization-order counterfactual with identical tests
        shell: bash
        run: |
          run_probe() {
            label="$1"
            mkdir -p "investigation-evidence/$label"
            rm -rf org.eclipse.jdt.core.tests.model/target/surefire-reports
            sha256sum -c investigation-evidence/test-source.sha256
            set +e
            mvn --batch-mode -U verify -pl org.eclipse.jdt.core.tests.model -am \
              -Ptest-on-javase-21 -Pbree-libs \
              -Dtest=BufferPublicationInvestigationTests -DfailIfNoTests=false \
              -Dsurefire.failIfNoSpecifiedTests=false -Dtycho.surefire.failIfNoTests=false \
              -Dcbi-ecj-version=99.99 -Dtycho.showEclipseLog=true -Dtycho.baseline.replace=none \
              -Dproject.build.sourceEncoding=UTF-8 \
              -Dtycho.surefire.argLine='--add-modules ALL-SYSTEM -Dcompliance=1.8 -Djdt.performance.asserts=disabled' \
              2>&1 | tee "investigation-evidence/$label/maven.log"
            code=${PIPESTATUS[0]}
            echo "$code" > "investigation-evidence/$label/maven-exit.txt"
            cp -a org.eclipse.jdt.core.tests.model/target/surefire-reports "investigation-evidence/$label/" || true
            find org.eclipse.jdt.core.tests.model/target/work -name '*.log' -type f -exec cp --parents '{}' "investigation-evidence/$label/" ';' || true
            set -e
            python3 - "$label" <<'PYCODE'
          from pathlib import Path
          import hashlib, json, sys, zipfile
          label = sys.argv[1]
          target = Path('org.eclipse.jdt.core/target')
          entry = 'org/eclipse/jdt/internal/core/ClassFile.class'
          compiled = (target / 'classes' / entry).read_bytes()
          jar = target / 'org.eclipse.jdt.core-3.48.0-SNAPSHOT.jar'
          with zipfile.ZipFile(jar) as archive:
              packaged = archive.read(entry)
          result = {
              'compiled_ClassFile_sha256': hashlib.sha256(compiled).hexdigest(),
              'packaged_ClassFile_sha256': hashlib.sha256(packaged).hexdigest(),
              'core_jar_sha256': hashlib.sha256(jar.read_bytes()).hexdigest(),
              'compiled_equals_packaged': compiled == packaged,
          }
          out = Path('investigation-evidence') / label
          (out / 'bytecode-provenance.json').write_text(json.dumps(result, indent=2) + '\n')
          (out / 'ClassFile.class').write_bytes(packaged)
          print(json.dumps(result, indent=2))
          assert compiled == packaged, 'Tycho replaced the artifact: packaged ClassFile differs from compiled ClassFile'
          with zipfile.ZipFile(target / 'org.eclipse.jdt.core-3.48.0-SNAPSHOT-sources.jar') as archive:
              packaged_source = archive.read('org/eclipse/jdt/internal/core/ClassFile.java')
          source = Path('org.eclipse.jdt.core/model/org/eclipse/jdt/internal/core/ClassFile.java').read_bytes()
          assert packaged_source == source, 'Source artifact was replaced by a baseline version'
          (out / 'ClassFile.java').write_bytes(source)
          PYCODE
            javap -p -c "investigation-evidence/$label/ClassFile.class" > "investigation-evidence/$label/ClassFile.javap.txt"
            python3 .github/scripts/check-buffer-publication.py "investigation-evidence/$label" --variant "$label" | tee "investigation-evidence/$label/classification.txt"
          }
          run_probe baseline
          test "$(cat investigation-evidence/baseline/maven-exit.txt)" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          p = Path('org.eclipse.jdt.core/model/org/eclipse/jdt/internal/core/ClassFile.java')
          text = p.read_text()
          before = '\t\tbufManager.addBuffer(buffer);\n\n\t\t// set the buffer source'
          after = '\n\t\t// set the buffer source'
          assert text.count(before) == 1, 'Expected exactly one real-source publication site'
          text = text.replace(before, after, 1)
          before = '\t\tbuffer.addBufferChangedListener(this);\n\n\t\t// do the source mapping'
          after = '\t\tbuffer.addBufferChangedListener(this);\n\t\tbufManager.addBuffer(buffer);\n\n\t\t// do the source mapping'
          assert text.count(before) == 1, 'Expected exactly one real-source listener site'
          text = text.replace(before, after, 1)
          p.write_text(text)
          PY
          git diff -- org.eclipse.jdt.core/model/org/eclipse/jdt/internal/core/ClassFile.java > investigation-evidence/experimental-publication-order.diff
          cat investigation-evidence/experimental-publication-order.diff
          run_probe initialized-before-publication
          test "$(cat investigation-evidence/initialized-before-publication/maven-exit.txt)" -eq 0
          sha256sum -c investigation-evidence/test-source.sha256
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('investigation-evidence')
          a = json.loads((root / 'baseline/bytecode-provenance.json').read_text())
          b = json.loads((root / 'initialized-before-publication/bytecode-provenance.json').read_text())
          assert a['packaged_ClassFile_sha256'] != b['packaged_ClassFile_sha256'], 'A/B used identical ClassFile bytecode'
          PY
          echo 'CAUSAL_COMPARISON_CONFIRMED: baseline 3 intended failures and 2 controls passed; reordered publication 5 passed.'
      - name: Retain actual JUnit evidence and experimental diff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buffer-publication-causal-comparison
          include-hidden-files: true
          path: investigation-evidence/
