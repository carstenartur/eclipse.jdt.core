name: JDT build-hardening candidate QA
on:
  push:
    branches: [qa/jdt-build-hardening]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-hardening-candidates
  cancel-in-progress: false
jobs:
  prepare-test-publish:
    if: github.repository == 'carstenartur/eclipse.jdt.core'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare clean candidates and fault-injection harnesses
        run: python .github/qa/build-hardening/prepare.py prepare
      - name: Verify the screenshot regression fails before mitigation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jdt-build-hardening/tracing-before"
          set +e
          mvn -B --no-transfer-progress clean test > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -ne 0
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          tests=[]
          for p in Path('target/surefire-reports').glob('TEST-*.xml'):
              tests.extend(E.parse(p).getroot().iter('testcase'))
          assert len(tests)==4, len(tests)
          assert all(t.find('failure') is not None and t.find('error') is None for t in tests)
          assert any('Injected unavailable display' in (t.find('failure').text or '') for t in tests)
          print('Verified four expected regression failures; no compilation or infrastructure failure.')
          PY
      - name: Verify corrected job waits and tracing on Java 21
        shell: bash
        run: |
          set -euo pipefail
          for harness in snapshot-tests tracing-after; do
            (cd "$RUNNER_TEMP/jdt-build-hardening/$harness" && mvn -B --no-transfer-progress clean test)
            cp -r "$RUNNER_TEMP/jdt-build-hardening/$harness/target/surefire-reports" "$RUNNER_TEMP/jdt-build-hardening/$harness/java21-reports"
          done
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '26'
      - name: Repeat job-wait regressions and verify tracing on Java 26
        shell: bash
        run: |
          set -euo pipefail
          java -version
          for i in 1 2 3 4 5; do
            (cd "$RUNNER_TEMP/jdt-build-hardening/snapshot-tests" && mvn -B --no-transfer-progress test)
            cp -r "$RUNNER_TEMP/jdt-build-hardening/snapshot-tests/target/surefire-reports" "$RUNNER_TEMP/jdt-build-hardening/snapshot-tests/java26-$i-reports"
          done
          (cd "$RUNNER_TEMP/jdt-build-hardening/tracing-after" && mvn -B --no-transfer-progress clean test)
      - name: Summarize individual test reports
        if: always()
        run: python .github/qa/build-hardening/prepare.py reports
      - name: Commit and push only the two verified candidate branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          python .github/qa/build-hardening/prepare.py publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jdt-build-hardening-candidates-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jdt-build-hardening/*.json
            ${{ runner.temp }}/jdt-build-hardening/*.patch
            ${{ runner.temp }}/jdt-build-hardening/tracing-before/baseline.log
            ${{ runner.temp }}/jdt-build-hardening/*/target/surefire-reports/
            ${{ runner.temp }}/jdt-build-hardening/*/*-reports/
          if-no-files-found: warn
