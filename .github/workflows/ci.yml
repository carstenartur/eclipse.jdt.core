name: PR 5380 paired performance QA
on:
  push:
    branches: [qa/pr5380-performance-ab]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr5380-performance-ab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-comparison:
    if: github.repository == 'carstenartur/eclipse.jdt.core'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the shared JDK toolchains
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
            26.0.2.1
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
            JavaSE-26
      - name: Verify the QA harness and record the environment
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/qa/pr5380 -v
          mkdir -p qa-evidence
          {
            echo 'Pinned source: 6b777ed704d1a0e00eb87f63ec9042b01b0acd6f'
            echo 'Order: without fix, then with fix; same runner and empty per-arm Maven/p2 caches'
            java -version
            mvn -version
            uname -a
            lscpu
            df -h
          } > qa-evidence/environment.txt 2>&1
          cat qa-evidence/environment.txt
      - name: A - complete Jenkins command without the production fix
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 115
        run: python .github/qa/pr5380/qa.py run without-fix
      - name: B - complete Jenkins command with the production fix
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 115
        run: python .github/qa/pr5380/qa.py run with-fix
      - name: Validate comparable results and produce the timing comparison
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: python .github/qa/pr5380/qa.py compare qa-evidence
      - name: Upload all available logs, source diffs, timings and JUnit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr5380-performance-ab-${{ github.run_id }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
