name: Completion 5364 full original suite
on:
  push:
    branches: [diagnostic/completion-5364-full]
    paths: ['diagnostics/completion5364-full/**', '.github/workflows/completion-5364-full.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: completion5364-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        arm: [base, pr]
        mode: [pristine, traced]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics-repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: carstenartur/eclipse.jdt.core
          ref: ${{ matrix.arm == 'base' && '8c40c7d2ae12c0a32ab3cca1ab31b53956c65d51' || 'd55a8c72e96ba601562fda02e5698da6323d37e7' }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
      - name: Run original formatter, DOM and model suites with the original TracingSuite
        run: >-
          python3 diagnostics-repo/diagnostics/completion5364-full/full_suite.py
          source diagnostics-repo/diagnostics/completion5364-maven evidence
          '${{ matrix.arm }}' '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion5364-full-${{ matrix.arm }}-${{ matrix.mode }}
          path: evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
