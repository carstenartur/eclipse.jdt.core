name: Completion 5364 controlled comparison
on:
  push:
    branches: [diagnostic/completion-5364]
    paths: ['diagnostics/completion5364/**', '.github/workflows/completion-5364-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        arm: [base, pr]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - name: Prepare identical SDKs, original tests and selected Core revision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/completion5364" evidence
          base=https://download.eclipse.org/eclipse/downloads/drops4/I20260826-2300
          curl -fLsS --retry 2 "$base/eclipse-SDK-I20260826-2300-linux-gtk-x86_64.tar.gz" -o "$RUNNER_TEMP/completion5364/sdk.tar.gz"
          curl -fLsS --retry 2 "$base/eclipse-Automated-Tests-I20260826-2300.zip" -o "$RUNNER_TEMP/completion5364/tests.zip"
          echo "1a81564c817ba6016557f6b75e3c3a31e3d4532f42e8ab8883b74ebcc68ddbce  $RUNNER_TEMP/completion5364/sdk.tar.gz" | sha256sum -c -
          echo "c0d56a10ac060f5dc4d917fe7836aa09143ac559bc445e3b987b5f9e2ad8bd0d  $RUNNER_TEMP/completion5364/tests.zip" | sha256sum -c -
          python3 diagnostics/completion5364/prepare.py '${{ matrix.arm }}' 2>&1 | tee evidence/preparation.txt
      - name: Run original test pair, complete class and preceding completion class
        run: |
          sdk="$RUNNER_TEMP/completion5364/eclipse"
          launcher=$(find "$sdk/plugins" -maxdepth 1 -name 'org.eclipse.equinox.launcher_*.jar' -print -quit)
          for mode in normal full predecessor; do
            repeats=8
            if [ "$mode" = full ]; then repeats=1; fi
            if [ "$mode" = predecessor ]; then repeats=2; fi
            set +e
            timeout 300 java -ea -Xmx1g -Djdt.default.test.compliance=1.8 -DDetectVMInstallationsJob.disabled=true \
              -Dprobe.mode="$mode" -Dprobe.repeats="$repeats" -Dprobe.debug=true \
              -jar "$launcher" -configuration "$sdk/configuration" -clean -nosplash -consolelog \
              -application completion5364.probe.run -data "$PWD/evidence/workspace-$mode" \
              > "evidence/$mode.txt" 2>&1
            status=$?
            echo "$status" > "evidence/$mode.exit"
            grep -E 'PROBE_|Exception|Error|RUNTIME' "evidence/$mode.txt" | tail -80 || true
          done
      - name: Require completed JUnit runs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          lines=['# Completion comparison: ${{ matrix.arm }}','']
          for mode in ['normal','full','predecessor']:
              p=Path('evidence')/(mode+'.txt');t=p.read_text(errors='replace')
              summaries=re.findall(r'^PROBE_RESULT .+$',t,re.M)
              if len(summaries)!=1: raise SystemExit('Incomplete '+mode+'; inspect logs')
              lines+=summaries
              lines += re.findall(r'^PROBE_(?:LAYER|FAILURE) .+$',t,re.M)
          text='\n'.join(lines)+'\n'
          Path('evidence/SUMMARY.md').write_text(text)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-5364-${{ matrix.arm }}
          path: evidence/
          include-hidden-files: true
          retention-days: 14
