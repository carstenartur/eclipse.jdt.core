name: Java CI with Maven
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: carstenartur/eclipse.jdt.debug/.github/workflows/jenkins-parity.yml@f37414a3c96111d32821162102bec1f447146427
    with:
      diagnostics: false
      source_ref: ${{ github.sha }}
      harness_ref: f37414a3c96111d32821162102bec1f447146427
