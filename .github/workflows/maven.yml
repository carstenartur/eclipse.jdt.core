name: Java CI with Maven
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: carstenartur/eclipse.jdt.debug/.github/workflows/jenkins-parity.yml@e1d2134f5cca5e88bfa8cd8b0ee6c947ee10fd1b
    with:
      diagnostics: false
      source_ref: ${{ github.sha }}
      harness_ref: e1d2134f5cca5e88bfa8cd8b0ee6c947ee10fd1b
