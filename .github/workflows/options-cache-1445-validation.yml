name: Options cache 1445 validation
on:
  push:
    branches: [diagnostic/options-cache-1445-validation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'carstenartur/eclipse.jdt.core'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile candidate and run exact baseline/fixed regression assertions
        run: bash diagnostics/options-cache/validate.sh
      - name: Commit tested production files on the clean upstream-based branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash diagnostics/options-cache/publish.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: options-cache-fix-evidence
          path: |
            evidence/*.txt
            evidence/*.exit
            evidence/*.md
            evidence/*.json
            evidence/*.patch
            evidence/workspace-*/workspace-*/.metadata/.log
          include-hidden-files: true
          if-no-files-found: warn
