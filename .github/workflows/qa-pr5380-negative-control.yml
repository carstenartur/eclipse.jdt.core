name: PR 5380 negative control

on:
  push:
    branches:
      - qa/pr5380-without-fix

concurrency:
  group: pr5380-negative-control
  cancel-in-progress: true

jobs:
  formatter-region-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDKs
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: |
            8
            17
            21
            25
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
          distribution: temurin
      - name: Build bootstrap compiler
        run: mvn clean install --batch-mode -f org.eclipse.jdt.core.compiler.batch -DlocalEcjVersion=99.99
      - name: Run FormatterRegionTests
        run: >-
          mvn -U clean verify --batch-mode --fail-at-end
          -pl org.eclipse.jdt.core.tests.model -am
          -Ptest-on-javase-21 -Pbree-libs
          -Dtest=FormatterRegionTests
          -Djava.io.tmpdir=$RUNNER_TEMP
          -Dproject.build.sourceEncoding=UTF-8
          -Dtycho.surefire.argLine="--add-modules ALL-SYSTEM -Dcompliance=1.8,11,17,20 -Djdt.performance.asserts=disabled"
          -Dcbi-ecj-version=99.99
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr5380-negative-control-test-results
          if-no-files-found: warn
          path: '**/target/surefire-reports/*FormatterRegionTests*'
