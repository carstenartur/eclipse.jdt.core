name: Buffer review regression QA
on:
  push:
    branches: [test/classfile-buffer-review]
concurrency:
  group: buffer-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Cancel superseded initial QA run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/carstenartur/eclipse.jdt.core/actions/runs/36515311309/cancel || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          cache: maven
          java-version: |
            8
            17
            21
            25
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
      - name: Build local compiler
        run: mvn -B -f org.eclipse.jdt.core.compiler.batch install -DlocalEcjVersion=99.99 -DskipTests
      - name: Verify upstream, previous PR and candidate with identical tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/review-buffer-qa.py')
          s = p.read_text()
          old = 'process=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)'
          new = "process=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,env={k:v for k,v in os.environ.items() if k not in {'GH_TOKEN','GITHUB_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN'}})"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          python3 .github/scripts/review-buffer-qa.py
      - name: Preserve test reports, logs and exact sources
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buffer-review-evidence
          include-hidden-files: true
          path: review-buffer-evidence/
