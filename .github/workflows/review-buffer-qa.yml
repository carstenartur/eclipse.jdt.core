name: Buffer review regression QA
on:
  push:
    branches: [test/classfile-buffer-review]
concurrency:
  group: buffer-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Remove superseded unsanitized diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/carstenartur/eclipse.jdt.core/actions/artifacts/11010961463 >/dev/null 2>&1; then
            gh api -X DELETE repos/carstenartur/eclipse.jdt.core/actions/artifacts/11010961463
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          cache: maven
          java-version: |
            8
            17
            21
            25
          mvn-toolchain-id: |
            JavaSE-1.8
            JavaSE-17
            JavaSE-21
            JavaSE-25
      - name: Build local compiler
        run: mvn -B -f org.eclipse.jdt.core.compiler.batch install -DlocalEcjVersion=99.99 -DskipTests
      - name: Verify upstream, previous PR and candidate with identical tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/review-buffer-qa.py')
          s = p.read_text()
          old = 'process=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)'
          new = "process=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,env={k:v for k,v in os.environ.items() if k not in {'GH_TOKEN','GITHUB_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN'}})"
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '    test_hash=hashlib.sha256(TEST.read_bytes()).hexdigest()'
          assert s.count(old) == 1
          s = s.replace(old, "    subprocess.run([sys.executable,'.github/scripts/review-buffer-tests-refine.py'],check=True)\n" + old)
          p.write_text(s)
          PY
          python3 .github/scripts/review-buffer-qa.py
      - name: Sanitize diagnostics before upload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          secrets = [os.environ[k].encode() for k in ('GH_TOKEN','GITHUB_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN') if os.environ.get(k)]
          for p in Path('review-buffer-evidence').rglob('*'):
            if p.is_file():
              original = data = p.read_bytes()
              for secret in secrets:
                data = data.replace(secret, b'[REDACTED]')
              if data != original:
                p.write_bytes(data)
          PY
      - name: Preserve test reports, logs and exact sources
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buffer-review-evidence
          include-hidden-files: true
          path: review-buffer-evidence/
